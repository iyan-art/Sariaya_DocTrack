<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- With Chrome's "Desktop site" on, Chrome ignores the viewport tag above
         and lays pages out about 980px wide, which an installed app inherits.
         No viewport value can undo that, so on a phone running installed this
         zooms the page back up to the real screen width, before first paint so
         the desktop scale never flashes. Desktop and tablet installs, and
         browser tabs, are left alone. index.css's .pwa-zoomed rules go with it. -->
    <script>
      (function () {
        var installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        var isPhone = Math.min(window.screen.width, window.screen.height) < 600;
        if (!installed || !isPhone) return;

        var root = document.documentElement;

        function fitToScreen() {
          var zoom = window.innerWidth / window.screen.width;
          var needsZoom = zoom > 1.1;
          root.classList.toggle('pwa-zoomed', needsZoom);
          root.style.zoom = needsZoom ? zoom : '';
          root.style.setProperty('--pwa-zoom', needsZoom ? zoom : 1);
        }

        fitToScreen();
        window.addEventListener('resize', fitToScreen);
      })();
    </script>
    <title>Sariaya DocTrack</title>

    <!-- PWA: installability (manifest + icons) and iOS/Android home-screen
         chrome. See public/manifest.json, public/sw.js, and
         src/components/InstallPWAButton.jsx for the rest of the setup. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sariaya DocTrack" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
